name: Source release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, matching VERSION (for example v0.9.0)'
        required: true
        default: 'v0.9.0'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify release version
        env:
          REQUESTED_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          python3 -c 'import os,pathlib; expected="v"+pathlib.Path("VERSION").read_text().strip(); assert not os.environ["REQUESTED_TAG"] or os.environ["REQUESTED_TAG"] == expected'
      - run: node tools/check_engine.cjs
      - run: node tools/check_recording.cjs
      - run: node tools/check_performance.cjs
      - run: node tools/check_serve_ui.cjs
      - run: python3 tools/package_release.py
      - name: Publish source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v$(cat VERSION)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its published assets."
          else
            gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "羽毛球计分 / Garmin Badminton Score $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
          fi
